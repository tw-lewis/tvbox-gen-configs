name: probe

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sync upstreams into pending
        run: python -m tvboxgen sync

      - name: Probe pending
        env:
          TVBOXGEN_RUNNER: gha-linux
        run: python -m tvboxgen probe

      - name: Promote ok → trusted
        run: python -m tvboxgen promote

      - name: Persist report
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: data/probe_report.json

      - name: Persist sources
        uses: actions/upload-artifact@v4
        with:
          name: synced-sources
          path: sources/
