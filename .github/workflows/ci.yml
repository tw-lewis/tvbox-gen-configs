name: ci

on:
  pull_request:
    paths:
      - "sources/**"
      - "src/**"
      - "tests/**"
      - "config.toml"
      - "requirements.txt"
      - "pyproject.toml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src
          ruff format --check src

      - name: Test
        run: pytest -q

      - name: Dry-run build with fixture report
        run: |
          mkdir -p data
          cp tests/fixtures/probe_report.json data/probe_report.json
          python -m tvboxgen build --dry-run
